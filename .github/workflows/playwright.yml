name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      TURSO_DATABASE_URL: "file::memory:"
      TURSO_AUTH_TOKEN: ci-local-only
      CLICKUP_CLIENT_SECRET: ci-test-secret
      CLICKUP_TOKEN: ""
      CLICKUP_NON_ADMIN_TOKEN: ""
      CLICKUP_MEMBER_TOKEN: ""
      ABLY_API_KEY: ""
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run unit and authorization checks
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run login smoke check
        run: pnpm test:smoke
      - name: Install Postman CLI
        run: npm install --global postman-cli@1.73.0
      - name: Run API and browser regression checks
        shell: bash
        run: |
          mkdir -p test-results
          postman simulation run postman/simulations/admin-dashboard.sim.yaml --port 4900 --output ndjson > test-results/postman-simulation.ndjson 2> test-results/postman-simulation.err &
          simulation_pid=$!
          for attempt in {1..30}; do
            if curl --fail --silent --output /dev/null --header 'x-test-mode: home' http://127.0.0.1:4900/clickup/api/v2/user; then
              break
            fi
            if ! kill -0 "$simulation_pid" 2>/dev/null; then
              cat test-results/postman-simulation.err
              exit 1
            fi
            sleep 1
          done
          curl --fail --silent --output /dev/null --header 'x-test-mode: home' http://127.0.0.1:4900/clickup/api/v2/user
          pnpm test:api
          pnpm test:browser
      - uses: actions/upload-artifact@v5
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          if-no-files-found: ignore
